```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Verification</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #222222;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 32px;
    border: 1px solid #e5e5e5;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
}

h1 {
    margin: 0 0 10px;
    font-size: 24px;
}

.description {
    margin-bottom: 24px;
    color: #666666;
    font-size: 14px;
    line-height: 1.6;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cccccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

button {
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

button:disabled {
    background: #a8b8d8;
    cursor: not-allowed;
}

#message {
    margin-top: 14px;
    font-size: 13px;
    line-height: 1.5;
}

.error {
    color: #c62828;
}

.success {
    color: #167443;
}
</style>
</head>

<body>
<main class="container">
    <h1>Email verification</h1>

    <p class="description">
        Enter your email address to continue. A valid address
        is required before proceeding.
    </p>

    <form id="emailForm">
        <label for="email">Email address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
        >

        <button type="submit" id="continueBtn" disabled>
            Continue
        </button>

        <p id="message" role="status" aria-live="polite"></p>
    </form>
</main>

<script>
const form = document.getElementById("emailForm");
const email = document.getElementById("email");
const button = document.getElementById("continueBtn");
const message = document.getElementById("message");

function validateEmail() {
    button.disabled = !email.validity.valid ||
                      email.value.trim() === "";

    message.textContent = "";
    message.className = "";
}

email.addEventListener("input", validateEmail);

form.addEventListener("submit", function(event) {
    event.preventDefault();

    if (!email.validity.valid || !email.value.trim()) {
        message.textContent = "Please enter a valid email address.";
        message.className = "error";
        return;
    }

    message.textContent =
        "Email format is valid. Actual verification is required before continuing.";
    message.className = "success";

    // Connect your authorized email-verification backend here.
    // Redirect only after the backend confirms verification.
});

validateEmail();
</script>
</body>
</html>
